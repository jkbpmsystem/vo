    .bp{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 3px 12px var(--glow)}.bg{background:#64748b10;color:var(--muted);border:1px solid #33415533}.bd{background:#dc2626;color:#fff}
    .fi{width:100%;padding:9px 11px;border-radius:9px;font-size:12.5px;border:1px solid #33415533;background:var(--surface);color:var(--text);outline:none;font-family:inherit}
    .lb{display:block;font-size:9.5px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.7px}
    .glass{background:#141428ee;border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(20px)}
    .badge{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:20px;font-size:9px;font-weight:700}
    .by{background:#052e16;color:var(--green);border:1px solid #16a34a33}.bn{background:#2a0a0a;color:var(--red);border:1px solid #dc262633}
    table{width:100%;border-collapse:collapse}th{text-align:left;padding:7px 8px;font-weight:800;font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);background:#0f0f2399;white-space:nowrap;position:sticky;top:0;z-index:2}
    td{padding:7px 8px;border-bottom:1px solid var(--border);font-size:11px}
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:999}
    .md{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:400px;width:92%;box-shadow:0 20px 50px rgba(0,0,0,.6)}
    .tst{position:fixed;bottom:20px;right:20px;color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.5);z-index:1000;animation:slideT .3s ease}
    .mono{font-family:'JetBrains Mono',monospace}.tag{background:#f9731612;color:var(--accent);padding:1px 7px;border-radius:5px;font-size:9px;font-weight:600;white-space:nowrap}
    .el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tb{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
    .sb{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid #33415522;border-radius:9px;padding:7px 12px;flex:1;min-width:140px}
    .sb input{border:none;outline:none;background:transparent;color:var(--text);font-size:12px;width:100%;font-family:inherit}
    .st{padding:4px 10px;border-radius:7px;background:var(--surface);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .ds{margin-top:16px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#f9731608,var(--surface));border:1px solid #f9731618}
    .lb-bar{height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:pulse 1s ease-in-out infinite}
    .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
    .g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
    .af{font-size:8px;color:var(--accent);margin-top:1px;font-style:italic}
    .st2{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.3px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #f9731620}
    .tw{overflow-x:auto;max-height:calc(100vh - 200px)}

  const hEd=(a)=>{sFm({...E0,...a});sEId(a.id);sVw("form")};
  const hDl=async(id)=>{sLd(true);(await FB.rm(id))?fl("Dipadam"):fl("Gagal","error");sDId(null);await rl();sLd(false)};

  const ft=useMemo(()=>as.filter(a=>{const q=sr.toLowerCase();return!q||[a.id,a.locationCode,a.area,a.department,a.equipmentName,a.assetNo,a.typeCode,a.brand,a.model,a.serialNo,a.vendor,a.bumi].some(f=>(f||"").toLowerCase().includes(q))}),[as,sr]);
  const tc=ft.reduce((s,a)=>s+(a.purchaseCost||0),0);

  const HD=["ID","Location","Area","Dept","Equipment","Desc","Group","Cost","AssetNo","TypeCode","TaskCode","Manufacturer","SerialNo","Brand","Model","Bumi","BumiContact","Vendor","VendorContact","NoLPO","WtyStart","WtyEnd","PPM","Edgenta","T&C","KEWPA","LPO","Cert"];
  const tR=(a)=>[(a.id||"").slice(-8),a.locationCode,a.area,a.department,a.equipmentName,a.equipmentDescription,a.assetGroup,a.purchaseCost||0,a.assetNo,a.typeCode,a.taskCode,a.manufacturer,a.serialNo,a.brand,a.model,a.bumi,a.bumiContact,a.vendor,a.vendorContact,a.noLPO,a.warrantyStart,a.warrantyEnd,a.ppmFrequency,a.contractEdgenta,a.tncForm,a.kewpa,a.lpo,a.cert];
  const dt=()=>new Date().toISOString().slice(0,10);
  const eXl=()=>{try{const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([HD,...ft.map(tR)]),"Aset");XLSX.writeFile(w,"VO_"+dt()+".xlsx");fl("Excel OK")}catch{fl("Fail","error")}};
  const eCs=()=>{try{const c=[HD,...ft.map(tR)].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");const b=new Blob(["\uFEFF"+c],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="VO_"+dt()+".csv";a.click();fl("CSV OK")}catch{fl("Fail","error")}};
  const ePf=()=>{try{const{jsPDF}=window.jspdf;const d=new jsPDF({orientation:"landscape",format:"a3"});d.setFontSize(13);d.text("Variation Order - Senarai Aset",14,14);d.setFontSize(7);d.text("Tarikh: "+new Date().toLocaleDateString("ms-MY")+" | "+ft.length+" rekod | RM "+tc.toLocaleString(),14,20);d.autoTable({startY:24,head:[HD],body:ft.map(tR),styles:{fontSize:5,cellPadding:1.2},headStyles:{fillColor:[249,115,22],fontSize:4.5},margin:{left:6,right:6}});d.save("VO_"+dt()+".pdf");fl("PDF OK")}catch{fl("Fail","error")}};

  if(ld&&!as.length)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:14}}>{Ic.fire}<div style={{fontSize:13,color:"var(--muted)"}}>Menyambung Firebase...</div><div className="lb-bar" style={{width:180,borderRadius:4}}/></div>;

  const renderForm=()=>(
    <div style={{padding:18,maxHeight:"calc(100vh - 100px)",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:6}}>
        <div><h2 style={{fontSize:15,fontWeight:800}}>{eId?"Kemaskini":"Daftar Baru"}</h2>{eId&&<span className="mono" style={{fontSize:10,color:"var(--accent)"}}>{eId}</span>}</div>
        <button className="btn bg" onClick={()=>{sVw("list");sEId(null);sFm({...E0})}}>{Ic.close} Batal</button>
      </div>

      <div className="st2">📍 Lokasi (Auto-fill Area & Dept)</div>
      <div className="g2">
        <div><label className="lb">Location Code *</label><select className="fi" value={fm.locationCode} onChange={e=>hLC(e.target.value)}><option value="">— Pilih —</option>{lKeys.map(k=><option key={k} value={k}>{k}</option>)}</select><div className="af">Pilih → Area & Department auto</div></div>
        <div><label className="lb">Area</label><input className="fi" value={fm.area} readOnly style={{background:"#0a0a1a",color:"var(--yellow)"}}/></div>
        <div><label className="lb">Department</label><input className="fi" value={fm.department} readOnly style={{background:"#0a0a1a",color:"var(--yellow)"}}/></div>
      </div>

      <div className="st2" style={{marginTop:16}}>🔧 Peralatan (Auto-fill Desc & Task)</div>
      <div className="g2">
        <div><label className="lb">Equipment Name *</label><input className="fi" value={fm.equipmentName} onChange={e=>F("equipmentName",e.target.value)}/></div>
        <div><label className="lb">Asset No</label><input className="fi mono" value={fm.assetNo} onChange={e=>F("assetNo",e.target.value)}/></div>
        <div><label className="lb">Type Code</label><select className="fi" value={fm.typeCode} onChange={e=>hTC(e.target.value)}><option value="">— Pilih —</option>{tKeys.map(k=><option key={k} value={k}>{k} - {EM[k].d.slice(0,35)}</option>)}</select><div className="af">Pilih → Description & Task auto</div></div>
        <div><label className="lb">Description</label><input className="fi" value={fm.equipmentDescription} readOnly style={{background:"#0a0a1a",color:"var(--yellow)"}}/></div>
        <div><label className="lb">Task Code</label><input className="fi mono" value={fm.taskCode} readOnly style={{background:"#0a0a1a",color:"var(--green)"}}/></div>
        <div><label className="lb">Asset Group</label><select className="fi" value={fm.assetGroup} onChange={e=>F("assetGroup",e.target.value)}><option value="">—</option><option>Mekanikal</option><option>Elektrikal</option></select></div>
        <div><label className="lb">Cost (RM)</label><input className="fi" type="number" value={fm.purchaseCost} onChange={e=>F("purchaseCost",e.target.value)}/></div>
      </div>

      <div className="st2" style={{marginTop:16}}>🏭 Pengeluar & Jenama</div>
      <div className="g3">
        <div><label className="lb">Manufacturer</label><input className="fi" value={fm.manufacturer} onChange={e=>F("manufacturer",e.target.value)}/></div>
        <div><label className="lb">Brand</label><input className="fi" value={fm.brand} onChange={e=>F("brand",e.target.value)}/></div>
        <div><label className="lb">Model</label><input className="fi" value={fm.model} onChange={e=>F("model",e.target.value)}/></div>
        <div><label className="lb">Serial No.</label><input className="fi mono" value={fm.serialNo} onChange={e=>F("serialNo",e.target.value)}/></div>
      </div>

      <div className="st2" style={{marginTop:16}}>🤝 Vendor & Bumi</div>
      <div className="g3">
        <div><label className="lb">Bumi</label><input className="fi" value={fm.bumi} onChange={e=>F("bumi",e.target.value)}/></div>
        <div><label className="lb">Bumi Contact</label><input className="fi" value={fm.bumiContact} onChange={e=>F("bumiContact",e.target.value)}/></div>
        <div><label className="lb">Vendor</label><input className="fi" value={fm.vendor} onChange={e=>F("vendor",e.target.value)}/></div>
        <div><label className="lb">Vendor Contact</label><input className="fi" value={fm.vendorContact} onChange={e=>F("vendorContact",e.target.value)}/></div>
        <div><label className="lb">No LPO</label><input className="fi" value={fm.noLPO} onChange={e=>F("noLPO",e.target.value)}/></div>
      </div>

      <div className="st2" style={{marginTop:16}}>📅 Warranty & PPM</div>
      <div className="g3">
        <div><label className="lb">Warranty Start</label><input className="fi" type="date" value={fm.warrantyStart} onChange={e=>F("warrantyStart",e.target.value)}/></div>
        <div><label className="lb">Warranty End</label><input className="fi" type="date" value={fm.warrantyEnd} onChange={e=>F("warrantyEnd",e.target.value)}/></div>
        <div><label className="lb">PPM Frequency</label><select className="fi" value={fm.ppmFrequency} onChange={e=>F("ppmFrequency",e.target.value)}><option value="">—</option>{PPM.map(f=><option key={f}>{f}</option>)}</select></div>
        <div><label className="lb">Contract Edgenta</label><select className="fi" value={fm.contractEdgenta} onChange={e=>F("contractEdgenta",e.target.value)}><option>No</option><option>Yes</option></select></div>
      </div>

      <div className="ds">
        <div className="st2" style={{borderBottom:"none",marginBottom:6}}>📄 Dokumen</div>
        <div className="g4">
          {[{k:"tncForm",l:"T&C"},{k:"kewpa",l:"KEW.PA"},{k:"lpo",l:"LPO"},{k:"cert",l:"Cert"}].map(({k,l})=>(
            <div key={k}><label className="lb">{l}</label><select className="fi" value={fm[k]} onChange={e=>F(k,e.target.value)}><option>No</option><option>Yes</option></select></div>
          ))}
        </div>
      </div>

      <div style={{marginTop:18,display:"flex",gap:8}}>
        <button className="btn bp" style={{padding:"10px 28px"}} onClick={hSub} disabled={ld}>{ld?"...":eId?"Kemaskini":"Daftar"}</button>
        <button className="btn bg" onClick={()=>{sFm({...E0});sEId(null)}}>Reset</button>
      </div>
    </div>
  );

  const renderList=()=>(
    <React.Fragment>
      <div className="tb">
        <div className="sb">{Ic.search}<input placeholder="Cari..." value={sr} onChange={e=>sSr(e.target.value)}/></div>
        <div className="st"><strong style={{color:"var(--text)"}}>{ft.length}</strong> rekod</div>
        <div className="st">RM <strong style={{color:"var(--accent)"}}>{tc.toLocaleString()}</strong></div>
        <button className="btn bg" style={{fontSize:9,padding:"6px 10px"}} onClick={rl}>{Ic.rf}</button>
        <div style={{position:"relative"}}>
          <button className="btn bg" style={{fontSize:9,padding:"6px 10px"}} onClick={()=>sSe(!se)}>{Ic.dl} Export</button>
          {se&&<div style={{position:"absolute",top:"calc(100% + 3px)",right:0,zIndex:50,background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:3,minWidth:140,boxShadow:"0 10px 25px rgba(0,0,0,.5)"}}>
            {[{l:"📊 Excel",f:eXl},{l:"📄 PDF",f:ePf},{l:"📋 CSV",f:eCs},{l:"⚡ Semua",f:()=>{eXl();ePf();eCs()}}].map(({l,f})=>(
              <button key={l} className="btn" style={{width:"100%",justifyContent:"flex-start",padding:"7px 10px",background:"transparent",color:"var(--text)",borderRadius:5,fontSize:10}} onMouseEnter={e=>e.currentTarget.style.background="#ffffff08"} onMouseLeave={e=>e.currentTarget.style.background="transparent"} onClick={()=>{f();sSe(false)}}>{l}</button>
            ))}
          </div>}
        </div>
        <button className="btn bp" style={{fontSize:10,padding:"7px 14px"}} onClick={()=>{sFm({...E0});sEId(null);sVw("form")}}>{Ic.plus} Daftar</button>
      </div>
      {ld&&<div className="lb-bar"/>}
      <div className="tw">
        <table>
          <thead><tr>
            {["#","Location","Area","Dept","Equipment","Type","Asset No","Brand/Model","S/N","RM","Vendor","Bumi","PPM","Edg","T&C","KEW","LPO","Crt",""].map(h=><th key={h}>{h}</th>)}
          </tr></thead>
          <tbody>
            {!ft.length&&<tr><td colSpan={19} style={{textAlign:"center",color:"var(--dim)",padding:36}}>{ld?"Memuatkan...":"Tiada rekod"}</td></tr>}
            {ft.map((a,i)=>(
              <tr key={a.id} className="rh" style={{background:i%2?"#0f0f2344":"transparent"}}>
                <td className="mono" style={{fontWeight:800,color:"var(--accent)",fontSize:9}}>{(a.id||"").slice(-5)}</td>
                <td className="mono" style={{fontSize:9,whiteSpace:"nowrap"}}>{a.locationCode}</td>
                <td className="el" style={{maxWidth:100,fontSize:10}}>{a.area}</td>
                <td className="el" style={{maxWidth:80,fontSize:9}}>{a.department}</td>
                <td style={{fontWeight:600,fontSize:10}}>{a.equipmentName}</td>
                <td><span className="tag">{a.typeCode||"-"}</span></td>
                <td className="mono" style={{fontSize:9}}>{a.assetNo||"-"}</td>
                <td className="el" style={{maxWidth:80,fontSize:9}}>{[a.brand,a.model].filter(Boolean).join("/")||"-"}</td>
                <td className="mono" style={{fontSize:9}}>{a.serialNo||"-"}</td>
                <td className="mono" style={{fontWeight:700,color:"var(--yellow)",fontSize:10}}>{(a.purchaseCost||0).toLocaleString()}</td>
                <td className="el" style={{maxWidth:70,fontSize:9}}>{a.vendor||"-"}</td>
                <td className="el" style={{maxWidth:70,fontSize:9}}>{a.bumi||"-"}</td>
                <td style={{fontSize:9}}>{a.ppmFrequency||"-"}</td>
                <td><Bd v={a.contractEdgenta||"No"}/></td>
                <td><Bd v={a.tncForm||"No"}/></td>
                <td><Bd v={a.kewpa||"No"}/></td>
                <td><Bd v={a.lpo||"No"}/></td>
                <td><Bd v={a.cert||"No"}/></td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn" style={{padding:"3px 6px",background:"#3b82f618",color:"var(--blue)",marginRight:2}} onClick={()=>hEd(a)}>{Ic.edit}</button>
                  <button className="btn" style={{padding:"3px 6px",background:"#ef444418",color:"var(--red)"}} onClick={()=>sDId(a.id)}>{Ic.trash}</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </React.Fragment>
  );

  return(
    <div style={{padding:"14px 8px"}}>
      <div style={{maxWidth:1500,margin:"0 auto 12px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {Ic.fire}
          <div>
            <div style={{fontSize:16,fontWeight:800}}><span style={{color:"var(--accent)"}}>Variation Order</span> — Pendaftaran Aset</div>
            <div style={{fontSize:9,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase"}}></div>
          </div>
        </div>
        <div className="st" style={{border:"1px solid #33415522",fontSize:9}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"var(--accent)",boxShadow:"0 0 6px var(--accent)",display:"inline-block"}}/>🔥 Firebase
        </div>
      </div>
      <div className="glass" style={{maxWidth:1500,margin:"0 auto",overflow:"hidden",animation:"fadeUp .4s ease"}}>
        {vw==="list"?renderList():renderForm()}
      </div>
      {dId&&<div className="ov" onClick={()=>sDId(null)}><div className="md" onClick={e=>e.stopPropagation()}>
        <h3 style={{fontSize:14,marginBottom:6}}>Padam?</h3>
        <p style={{color:"var(--muted)",fontSize:11,marginBottom:16}}>Padam <strong className="mono" style={{color:"var(--red)"}}>{String(dId).slice(-6)}</strong>?</p>
        <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
          <button className="btn bg" onClick={()=>sDId(null)}>Batal</button>
          <button className="btn bd" onClick={()=>hDl(dId)}>Padam</button>
        </div>
      </div></div>}
      {ts&&<div className="tst" style={{background:ts.t==="error"?"#dc2626":"#16a34a"}}>{ts.m}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
