<html lang="ms">
<head>

  <style>

      --surface: #0f0f23;
      --accent: #f97316;
      --accent-glow: #f9731633;
      --text: #e2e8f0;
      --muted: #64748b;
      --dim: #334155;
      --border: #ffffff0a;
      --green: #4ade80;
      --red: #f87171;
      --blue: #60a5fa;
      --yellow: #fbbf24;
    }
    body {
      font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
      background: radial-gradient(ellipse at 20% 0%, #1e1638 0%, var(--bg) 50%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
    @keyframes fadeUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes slideToast { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
    select option { background: var(--surface); color: var(--text); }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background: #33415544; border-radius:3px; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent) !important; }
    .row-hover:hover { background: #f9731608 !important; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:10px; border:none; cursor:pointer; font-size:12.5px; font-weight:700; transition:all 0.2s; font-family:inherit; }
    .btn:hover { filter: brightness(1.15); }
    .btn-primary { background:linear-gradient(135deg,#f97316,#ea580c); color:#fff; box-shadow:0 3px 14px var(--accent-glow); }
    .btn-ghost { background:#64748b10; color:var(--muted); border:1px solid #33415533; }
    .btn-danger { background:#dc2626; color:#fff; }
    .input-field {
      width:100%; padding:11px 14px; border-radius:10px; font-size:13.5px;
      border:1px solid #33415533; background:var(--surface); color:var(--text);
      outline:none; transition:border 0.2s; font-family:inherit;
    }
    .label { display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.8px; }
    .glass { background:#141428ee; border:1px solid var(--border); border-radius:16px; backdrop-filter:blur(20px); }
    .badge {
      display:inline-flex; align-items:center; gap:3px;
      padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700;
    }
    .badge-yes { background:#052e16; color:var(--green); border:1px solid #16a34a33; }
    .badge-no { background:#2a0a0a; color:var(--red); border:1px solid #dc262633; }
    table { width:100%; border-collapse:collapse; }
    th {
      text-align:left; padding:11px 12px; font-weight:800; font-size:10px;
      text-transform:uppercase; letter-spacing:1.2px; color:var(--muted);
      border-bottom:1px solid var(--border); background:#0f0f2388; white-space:nowrap;
    }
    td { padding:11px 12px; border-bottom:1px solid var(--border); font-size:13px; }
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; z-index:999;
    }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px; max-width:420px; width:92%; box-shadow:0 25px 60px rgba(0,0,0,0.6); }
    .setup-modal { background:#1a1a2e; border:1px solid #ffffff12; border-radius:20px; padding:36px; max-width:560px; width:92%; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
    .toast {
      position:fixed; bottom:24px; right:24px; color:#fff; padding:12px 24px;
      border-radius:12px; font-size:13px; font-weight:700;
      box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:1000; animation:slideToast 0.3s ease;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .tag { background:#f9731612; color:var(--accent); padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; white-space:nowrap; }
    .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .search-box {
      display:flex; align-items:center; gap:8px;
      background:var(--surface); border:1px solid #33415522;
      border-radius:10px; padding:8px 14px; flex:1; min-width:180px;
    }
    .search-box input { border:none; outline:none; background:transparent; color:var(--text); font-size:13px; width:100%; font-family:inherit; }
    .stat { padding:6px 14px; border-radius:8px; background:var(--surface); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; }
    .doc-section {
      margin-top:22px; padding:20px; border-radius:14px;
      background:linear-gradient(135deg, #f9731608, var(--surface));
      border:1px solid #f9731618;
    }
    .loading-bar { height:3px; background:linear-gradient(90deg, transparent, var(--accent), transparent); animation:pulse 1s ease-in-out infinite; }
    .api-log {
      background:#08081a; border-radius:12px; padding:14px;
      font-family:'JetBrains Mono', monospace; font-size:11px;
      max-height:180px; overflow-y:auto; border:1px solid #33415522;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── Firebase REST API Wrapper ─────────────────────────────────
    const firebaseDB = {
      baseUrl: "",
      async getAll() {
        try {
          const res = await fetch(this.baseUrl + "/assets.json");
          const data = await res.json();
          if (!data) return [];
          return Object.entries(data).map(([id, val]) => ({ id, ...val }));
        } catch (e) { console.error("GET:", e); return null; }
      },
      async create(record) {
        try {
          const payload = { ...record, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
          const res = await fetch(this.baseUrl + "/assets.json", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          return { id: data.name, ...payload };
        } catch (e) { console.error("POST:", e); return null; }
      },
      async update(id, record) {
        try {
          const payload = { ...record, updatedAt: new Date().toISOString() };
          await fetch(this.baseUrl + "/assets/" + id + ".json", {
            method: "PATCH", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          return { id, ...payload };
        } catch (e) { console.error("PATCH:", e); return null; }
      },
      async remove(id) {
        try {
          await fetch(this.baseUrl + "/assets/" + id + ".json", { method: "DELETE" });
          return true;
        } catch (e) { console.error("DELETE:", e); return false; }
      },
    };

    // ─── Local Fallback DB ─────────────────────────────────────────
    const localDB = {
      assets: [], nextId: 1001,
      async getAll() { return [...this.assets]; },
      async create(r) {
        const e = { ...r, id: "VO-" + this.nextId++, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        this.assets.unshift(e); return e;
      },
      async update(id, r) {
        const i = this.assets.findIndex(a => a.id === id);
        if (i === -1) return null;
        this.assets[i] = { ...this.assets[i], ...r, updatedAt: new Date().toISOString() };
        return this.assets[i];
      },
      async remove(id) {
        const i = this.assets.findIndex(a => a.id === id);
        if (i === -1) return false;
        this.assets.splice(i, 1); return true;
      },
    };

    // ─── Constants ─────────────────────────────────────────────────
    const HOSPITALS = ["Hospital Sultan Zainal Abidin"];
    const DEPARTMENTS = [""MEL","PUBLIC AMENITIES LEVEL 1 (+ MAIN ENTRANCE & LOBBY)","MSU","MEDICAL SOCIAL UNIT","PRU","PUBLIC RELATION UNIT","ARC","ADMISSION & REVENUE COLLECTION","IMG","IMAGING DEPARTMENT","ED","EMERGENCY DEPARTMENT","PAC","OBSTETRIC & GYNAECOLOGY ADMISSION CENTRE /PAC","OPD","OUTPATIENT PHARMACY","AUD","AUDITORIUM (LEVEL 1 & LEVEL 2)","RHB","REHABILITATION DEPARTMENT","CPS","CENTRAL PHARMACY STORE","IPD","INPATIENT PHARMACY","DIET","DIETETICS SERVICES DEPARTMENT /KITCHEN","MOR","MORTUARY","IBS","INTEGRATED BIOMEDICAL STORE","BEM","BIOMEDICAL, ENGINEERING AND MAINTENANCE SERVICES","LSU","LINEN SUPPLIES UNIT","HKS","HYGIENE & HOUSEKEEPING SERVICES","TPS","TRANSPORT & PORTERAGE SERVICES","SS","SECURITY SERVICES","WMU","WASTE MANAGEMENT UNIT","OGP","OBSTETRIC, GYNA & PAEDIATRIC CLINIC","GMC","GENERAL MEDICAL CLINIC","EOC","ENT & OPTHALMOLOGY CLINIC","PSC","PSYCHIATRIC SPECIALIST CLINIC","OSC","ORTHOPEDIC & SURGICAL CLINIC","CEW","CLINICAL EXAM WARD","CEA","CLINICAL EXAM AREA","HOS","HOD SHARED FACILITIES","HOU","HEAD OF UNIT","MDL","MEDICAL DIAGNOSTIC LAB","IT","INFORMATION TECHNOLOGY DEPARTMENT","MR","MEDICAL RECORD DEPARTMENT","PA2","PUBLIC AMENITIES LEVEL 2","OT","OPERATION THEATRE","SED","SURGICAL & ENDOSCOPY DAYCARE","CIC","CENTRALIZED INTENSIVE CARE","CSSD","CENTRAL STERILE SERVICES DEPARTMENT","RHU","RESPIRATORY HAEMODYNAMIC MAINTENANCE UNIT","LDS","LABOUR & DELIVERY SUITE","MOT","MATERNITY OPERATION THEATRE","NICU","NEONATAL INTENSIVE CARE UNIT","SFW","SHARED FACILITIES (WARDS)","SW1","SURGICAL WARD 1","OW","OBSTETRIC WARD","PA3","PUBLIC AMENITIES LEVEL 3","OCC","ON CALL COMPLEX","SFA","SHARED FACILITIES - ADMIN (SF)","M&A","MANAGEMENT & ADMINISTRATIVE OFFICE","FU","FINANCE UNIT","HR","HUMAN RESOURCE DEPARTMENT","MW1","MEDICAL WARD 1","MW2","MEDICAL WARD 2","MPD","MEDICAL & PAEDIATRIC DAYCARE","PA4","PUBLIC AMENITIES LEVEL 4","SW2","SURGICAL WARD 2","PW","PAEDIATRIC WARD","PA5","PUBLIC AMENITIES LEVEL 5","LBR","LIBRARY","RW","ROYAL WARD","SFT","SHARED FACILITIES - TEACHING & LEARNING","PA6","PUBLIC AMENITIES LEVEL 6""];
    const ASSET_GROUPS = ["Mekanikal","Elektrikal"];
    const EMPTY = { hospital:"", department:"", equipmentName:"", equipmentDescription:"", assetGroup:"", purchaseCost:"", tncForm:"No", kewpa:"No", lpo:"No", cert:"No" };
    const SEEDS = [
      { hospital:"Hospital Kuala Lumpur", department:"Radiology", equipmentName:"Digital X-Ray System", equipmentDescription:"High-resolution digital radiography with flat panel detector", assetGroup:"Elektrikal", purchaseCost:450000, tncForm:"Yes", kewpa:"Yes", lpo:"Yes", cert:"No" },
      { hospital:"Hospital Sultanah Aminah", department:"ICU", equipmentName:"Ventilator", equipmentDescription:"Advanced ICU ventilator with multiple ventilation modes", assetGroup:"Mekanikal", purchaseCost:120000, tncForm:"Yes", kewpa:"No", lpo:"Yes", cert:"Yes" },
      { hospital:"Hospital Pulau Pinang", department:"Laboratory", equipmentName:"Blood Analyzer", equipmentDescription:"Automated hematology analyzer for CBC", assetGroup:"Elektrikal", purchaseCost:280000, tncForm:"No", kewpa:"Yes", lpo:"Yes", cert:"Yes" },
    ];

    // ─── SVG Icons ─────────────────────────────────────────────────
    const Ic = {
      plus: <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>,
      edit: <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      trash: <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>,
      search: <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>,
      close: <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>,
      check: <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#16a34a" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>,
      x: <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="#ef4444" strokeWidth="3" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>,
      fire: <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 23c-4.97 0-9-3.58-9-8 0-3.19 2.13-6.17 3.38-7.54A1 1 0 018 7.82c.13 1.63.89 2.65 1.53 3.19.1-.93.51-2.26 1.68-3.64C12.6 5.65 12.31 3.26 12.07 2a1 1 0 011.61-.81C15.61 2.63 21 6.84 21 15c0 4.42-4.03 8-9 8z" fill="#f97316"/><path d="M12 23c-2.76 0-5-1.79-5-4 0-2.09 1.28-3.48 2.34-4.32a.5.5 0 01.8.44c-.05.8.15 1.49.5 1.96.17-.71.64-1.56 1.43-2.31.39-.37.45-.66.44-1.27a.5.5 0 01.84-.38C14.64 13.28 17 15.34 17 19c0 2.21-2.24 4-5 4z" fill="#fbbf24"/></svg>,
      db: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
      refresh: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>,
      download: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    };

    const Badge = ({ v }) => (
      <span className={"badge " + (v === "Yes" ? "badge-yes" : "badge-no")}>
        {v === "Yes" ? Ic.check : Ic.x} {v}
      </span>
    );

    // ═══════════════════════════════════════════════════════════════
    // MAIN APP COMPONENT
    // ═══════════════════════════════════════════════════════════════
    function App() {
      const [db, setDb] = useState(null);
      const [mode, setMode] = useState(null);
      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(false);
      const [view, setView] = useState("list");
      const [editId, setEditId] = useState(null);
      const [form, setForm] = useState({ ...EMPTY });
      const [search, setSearch] = useState("");
      const [toast, setToast] = useState(null);
      const [delId, setDelId] = useState(null);
      const [apiLog, setApiLog] = useState([]);
      const [showLog, setShowLog] = useState(false);

      const log = (method, endpoint, status, detail = "") => {
        setApiLog(prev => [{ id: Date.now(), time: new Date().toLocaleTimeString("en-GB"), method, endpoint, status, detail }, ...prev.slice(0, 39)]);
      };
      const flash = (msg, type = "success") => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

      const loadAssets = async (database) => {
        setLoading(true);
        const data = await database.getAll();
        if (data === null) {
          flash("Gagal sambung Firebase. Semak URL & rules.", "error");
          log("GET", "/assets.json", 500, "Connection failed");
        } else {
          setAssets(data);
          log("GET", "/assets.json", 200, data.length + " records");
        }
        setLoading(false);
      };

      const initFirebase = async (url) => {
        firebaseDB.baseUrl = url.replace(/\/$/, "");
        setDb(firebaseDB);
        setMode("firebase");
        log("INIT", url.slice(0, 50), 200, "Firebase connected");
        await loadAssets(firebaseDB);
      };

      const initLocal = async () => {
        for (const s of SEEDS) await localDB.create(s);
        setDb(localDB);
        setMode("local");
        log("INIT", "local://memory", 200, "Local DB ready");
        await loadAssets(localDB);
      };

      // Auto-connect Firebase on first load
      useEffect(() => {
        const autoUrl = "https://fnbjkb-4727b-default-rtdb.asia-southeast1.firebasedatabase.app";
        firebaseDB.baseUrl = autoUrl;
        setDb(firebaseDB);
        setMode("firebase");
        log("INIT", autoUrl.slice(0, 50), 200, "Firebase auto-connected");
        loadAssets(firebaseDB);
      }, []);

      const handleSubmit = async () => {
        if (!form.hospital || !form.department || !form.equipmentName || !form.purchaseCost) {
          flash("Sila lengkapkan semua medan wajib (*)", "error"); return;
        }
        setLoading(true);
        const payload = { ...form, purchaseCost: Number(form.purchaseCost) };
        try {
          if (editId) {
            const r = await db.update(editId, payload);
            if (!r) throw new Error();
            log("PATCH", "/assets/" + editId + ".json", 200, "Updated");
            flash("Aset berjaya dikemaskini");
          } else {
            const r = await db.create(payload);
            if (!r) throw new Error();
            log("POST", "/assets.json", 201, "Created " + r.id);
            flash("Aset " + r.id + " berjaya didaftarkan");
          }
          await loadAssets(db);
          setForm({ ...EMPTY }); setEditId(null); setView("list");
        } catch { flash("Ralat semasa menyimpan", "error"); }
        setLoading(false);
      };

      const handleEdit = (a) => {
        setForm({ hospital:a.hospital||"", department:a.department||"", equipmentName:a.equipmentName||"", equipmentDescription:a.equipmentDescription||"", assetGroup:a.assetGroup||"", purchaseCost:String(a.purchaseCost||""), tncForm:a.tncForm||"No", kewpa:a.kewpa||"No", lpo:a.lpo||"No", cert:a.cert||"No" });
        setEditId(a.id); setView("form");
      };

      const handleDelete = async (id) => {
        setLoading(true);
        const ok = await db.remove(id);
        ok ? (log("DELETE","/assets/"+id+".json",200), flash("Aset dipadam")) : (log("DELETE","/assets/"+id+".json",500), flash("Gagal padam","error"));
        setDelId(null); await loadAssets(db); setLoading(false);
      };

      // ─── Export Functions ───────────────────────────────────────
      const HEADERS = ["ID","Hospital","Department","Equipment Name","Equipment Description","Asset Group","Purchase Cost (RM)","T&C Form","KEW.PA","LPO","Certificate"];
      const toRows = (data) => data.map(a => [
        (a.id||"").slice(-8), a.hospital, a.department, a.equipmentName,
        a.equipmentDescription, a.assetGroup, a.purchaseCost || 0,
        a.tncForm, a.kewpa, a.lpo, a.cert
      ]);
      const timestamp = () => new Date().toISOString().slice(0,10);

      const exportExcel = () => {
        try {
          const wb = XLSX.utils.book_new();
          const wsData = [HEADERS, ...toRows(filtered)];
          const ws = XLSX.utils.aoa_to_sheet(wsData);
          // Column widths
          ws['!cols'] = [{ wch:10 },{ wch:28 },{ wch:18 },{ wch:24 },{ wch:40 },{ wch:20 },{ wch:16 },{ wch:8 },{ wch:8 },{ wch:8 },{ wch:10 }];
          XLSX.utils.book_append_sheet(wb, ws, "Aset VO");
          XLSX.writeFile(wb, "VO_Aset_" + timestamp() + ".xlsx");
          flash("Excel berjaya dimuat turun");
          log("EXPORT", "Excel (.xlsx)", 200, filtered.length + " records");
        } catch (e) { flash("Gagal export Excel", "error"); console.error(e); }
      };

      const exportCSV = () => {
        try {
          const rows = [HEADERS, ...toRows(filtered)];
          const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
          const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "VO_Aset_" + timestamp() + ".csv"; a.click();
          URL.revokeObjectURL(url);
          flash("CSV berjaya dimuat turun");
          log("EXPORT", "CSV (.csv)", 200, filtered.length + " records");
        } catch (e) { flash("Gagal export CSV", "error"); console.error(e); }
      };

      const exportPDF = () => {
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

          // Title
          doc.setFontSize(16);
          doc.setFont("helvetica", "bold");
          doc.text("Variation Order - Senarai Pendaftaran Aset", 14, 18);
          doc.setFontSize(9);
          doc.setFont("helvetica", "normal");
          doc.setTextColor(100);
          doc.text("Tarikh Export: " + new Date().toLocaleDateString("ms-MY") + "  |  Jumlah Rekod: " + filtered.length + "  |  Jumlah Kos: RM " + totalCost.toLocaleString(), 14, 25);
          doc.setTextColor(0);

          // Table
          doc.autoTable({
            startY: 30,
            head: [HEADERS],
            body: toRows(filtered).map(r => { r[6] = "RM " + Number(r[6]).toLocaleString(); return r; }),
            styles: { fontSize: 7.5, cellPadding: 2.5 },
            headStyles: { fillColor: [249, 115, 22], textColor: 255, fontStyle: "bold", fontSize: 7.5 },
            alternateRowStyles: { fillColor: [245, 245, 250] },
            columnStyles: {
              0: { cellWidth: 18, fontStyle: "bold" },
              4: { cellWidth: 50 },
              6: { halign: "right", fontStyle: "bold" },
            },
            margin: { left: 14, right: 14 },
            didDrawPage: (data) => {
              doc.setFontSize(7);
              doc.setTextColor(150);
              doc.text("Variation Order Asset Registration System", 14, doc.internal.pageSize.height - 8);
              doc.text("Halaman " + doc.internal.getNumberOfPages(), doc.internal.pageSize.width - 30, doc.internal.pageSize.height - 8);
            },
          });

          doc.save("VO_Aset_" + timestamp() + ".pdf");
          flash("PDF berjaya dimuat turun");
          log("EXPORT", "PDF (.pdf)", 200, filtered.length + " records");
        } catch (e) { flash("Gagal export PDF", "error"); console.error(e); }
      };

      const [showExport, setShowExport] = useState(false);

      const filtered = assets.filter(a => {
        const q = search.toLowerCase();
        return !q || [a.id,a.hospital,a.department,a.equipmentName,a.assetGroup].some(f => (f||"").toLowerCase().includes(q));
      });
      const totalCost = filtered.reduce((s, a) => s + (a.purchaseCost || 0), 0);

      const F = (key, val) => setForm(prev => ({ ...prev, [key]: val }));

      // ─── Loading Screen (auto-connecting to Firebase) ──────────
      if (!db) {
        return (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", flexDirection:"column", gap:16 }}>
            {Ic.fire}
            <div style={{ fontSize:14, color:"var(--muted)" }}>Menyambung ke Firebase...</div>
            <div className="loading-bar" style={{ width:200, borderRadius:4 }} />
          </div>
        );
      }

      // ─── Form View ──────────────────────────────────────────────
      const renderForm = () => (
        <div style={{ padding:24 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24, flexWrap:"wrap", gap:8 }}>
            <div>
              <h2 style={{ fontSize:17, fontWeight:800 }}>{editId ? "Kemaskini Aset" : "Pendaftaran Aset Baru"}</h2>
              {editId && <span className="mono" style={{ fontSize:12, color:"var(--accent)" }}>{editId}</span>}
            </div>
            <button className="btn btn-ghost" onClick={() => { setView("list"); setEditId(null); setForm({...EMPTY}); }}>
              {Ic.close} Batal
            </button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(260px, 1fr))", gap:18 }}>
            <div>
              <label className="label">Hospital *</label>
              <select className="input-field" value={form.hospital} onChange={e => F("hospital", e.target.value)}>
                <option value="">— Pilih Hospital —</option>
                {HOSPITALS.map(h => <option key={h}>{h}</option>)}
              </select>
            </div>
            <div>
              <label className="label">Department *</label>
              <select className="input-field" value={form.department} onChange={e => F("department", e.target.value)}>
                <option value="">— Pilih Department —</option>
                {DEPARTMENTS.map(d => <option key={d}>{d}</option>)}
              </select>
            </div>
            <div>
              <label className="label">Equipment Name *</label>
              <input className="input-field" placeholder="Cth: Digital X-Ray System" value={form.equipmentName} onChange={e => F("equipmentName", e.target.value)} />
            </div>
            <div>
              <label className="label">Asset Group</label>
              <select className="input-field" value={form.assetGroup} onChange={e => F("assetGroup", e.target.value)}>
                <option value="">— Pilih Asset Group —</option>
                {ASSET_GROUPS.map(g => <option key={g}>{g}</option>)}
              </select>
            </div>
            <div>
              <label className="label">Purchase Cost (RM) *</label>
              <input className="input-field" type="number" placeholder="0.00" value={form.purchaseCost} onChange={e => F("purchaseCost", e.target.value)} />
            </div>
            <div style={{ gridColumn:"1 / -1" }}>
              <label className="label">Equipment Description</label>
              <textarea className="input-field" style={{ minHeight:72, resize:"vertical" }} placeholder="Penerangan lengkap..." value={form.equipmentDescription} onChange={e => F("equipmentDescription", e.target.value)} />
            </div>
          </div>
          <div className="doc-section">
            <h3 style={{ margin:"0 0 16px", fontSize:12, fontWeight:800, color:"var(--accent)", textTransform:"uppercase", letterSpacing:1.5 }}>Dokumen & Sijil</h3>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px, 1fr))", gap:14 }}>
              {[{k:"tncForm",l:"T&C Form"},{k:"kewpa",l:"KEW.PA"},{k:"lpo",l:"LPO"},{k:"cert",l:"Certificate"}].map(({k,l}) => (
                <div key={k}>
                  <label className="label">{l}</label>
                  <select className="input-field" value={form[k]} onChange={e => F(k, e.target.value)}>
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                  </select>
                </div>
              ))}
            </div>
          </div>
          <div style={{ marginTop:26, display:"flex", gap:10 }}>
            <button className="btn btn-primary" style={{ padding:"12px 36px", fontSize:14 }} onClick={handleSubmit} disabled={loading}>
              {loading ? "Menyimpan..." : editId ? "Kemaskini" : "Daftar Aset"}
            </button>
            <button className="btn btn-ghost" onClick={() => { setForm({...EMPTY}); setEditId(null); }}>Reset</button>
          </div>
        </div>
      );

      // ─── List View ──────────────────────────────────────────────
      const renderList = () => (
        <React.Fragment>
          <div className="toolbar">
            <div className="search-box">
              {Ic.search}
              <input placeholder="Cari aset..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="stat"><strong style={{ color:"var(--text)" }}>{filtered.length}</strong> rekod</div>
            <div className="stat">Jumlah: <strong style={{ color:"var(--accent)" }}>RM {totalCost.toLocaleString()}</strong></div>
            <button className="btn btn-ghost" style={{ fontSize:11 }} onClick={() => loadAssets(db)}>{Ic.refresh} Refresh</button>
            <button className="btn btn-ghost" style={{ fontSize:11 }} onClick={() => setShowLog(!showLog)}>{Ic.db} API Log</button>
            <div style={{ position:"relative" }}>
              <button className="btn btn-ghost" style={{ fontSize:11, background: showExport ? "#f9731618" : undefined, color: showExport ? "var(--accent)" : undefined }} onClick={() => setShowExport(!showExport)}>{Ic.download} Export</button>
              {showExport && (
                <div style={{
                  position:"absolute", top:"calc(100% + 6px)", right:0, zIndex:50,
                  background:"var(--card)", border:"1px solid var(--border)", borderRadius:12,
                  padding:6, minWidth:180, boxShadow:"0 16px 40px rgba(0,0,0,0.5)",
                }}>
                  <button className="btn" style={{ width:"100%", justifyContent:"flex-start", padding:"10px 14px", color:"var(--green)", background:"transparent", borderRadius:8, fontSize:12 }}
                    onMouseEnter={e => e.currentTarget.style.background="#4ade8012"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}
                    onClick={() => { exportExcel(); setShowExport(false); }}>
                    <span style={{ fontSize:15 }}>📊</span> Export Excel (.xlsx)
                  </button>
                  <button className="btn" style={{ width:"100%", justifyContent:"flex-start", padding:"10px 14px", color:"var(--red)", background:"transparent", borderRadius:8, fontSize:12 }}
                    onMouseEnter={e => e.currentTarget.style.background="#f8717112"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}
                    onClick={() => { exportPDF(); setShowExport(false); }}>
                    <span style={{ fontSize:15 }}>📄</span> Export PDF (.pdf)
                  </button>
                  <button className="btn" style={{ width:"100%", justifyContent:"flex-start", padding:"10px 14px", color:"var(--blue)", background:"transparent", borderRadius:8, fontSize:12 }}
                    onMouseEnter={e => e.currentTarget.style.background="#60a5fa12"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}
                    onClick={() => { exportCSV(); setShowExport(false); }}>
                    <span style={{ fontSize:15 }}>📋</span> Export CSV (.csv)
                  </button>
                  <div style={{ borderTop:"1px solid var(--border)", margin:"4px 0" }} />
                  <button className="btn" style={{ width:"100%", justifyContent:"flex-start", padding:"10px 14px", color:"var(--yellow)", background:"transparent", borderRadius:8, fontSize:12 }}
                    onMouseEnter={e => e.currentTarget.style.background="#fbbf2412"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}
                    onClick={() => { exportExcel(); exportPDF(); exportCSV(); setShowExport(false); }}>
                    <span style={{ fontSize:15 }}>⚡</span> Export Semua
                  </button>
                </div>
              )}
            </div>
            <button className="btn btn-primary" onClick={() => { setForm({...EMPTY}); setEditId(null); setView("form"); }}>{Ic.plus} Daftar Baru</button>
          </div>

          {showLog && (
            <div style={{ padding:"0 18px 14px" }}>
              <div className="api-log">
                <div style={{ color:"var(--accent)", fontWeight:700, marginBottom:8, fontSize:10, textTransform:"uppercase", letterSpacing:1 }}>
                  🔥 {mode === "firebase" ? "Firebase REST" : "Local"} API Log
                </div>
                {apiLog.length === 0 && <div style={{ color:"var(--dim)" }}>Tiada log...</div>}
                {apiLog.map(l => (
                  <div key={l.id} style={{ padding:"3px 0", display:"flex", gap:8, borderBottom:"1px solid #33415511" }}>
                    <span style={{ color:"var(--dim)", minWidth:70 }}>{l.time}</span>
                    <span style={{ fontWeight:800, minWidth:52, color: l.method==="GET"?"var(--green)":l.method==="POST"?"var(--blue)":l.method==="PATCH"?"var(--yellow)":l.method==="DELETE"?"var(--red)":"#a78bfa" }}>{l.method}</span>
                    <span style={{ flex:1 }}>{l.endpoint}</span>
                    <span style={{ color:l.status<400?"var(--green)":"var(--red)" }}>{l.status}</span>
                    {l.detail && <span style={{ color:"var(--dim)" }}>{l.detail}</span>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {loading && <div className="loading-bar" />}

          <div style={{ overflowX:"auto" }}>
            <table>
              <thead>
                <tr>
                  {["ID","Hospital","Department","Equipment","Description","Asset Group","Kos (RM)","T&C","KEW.PA","LPO","Cert",""].map(h => <th key={h}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr><td colSpan={12} style={{ textAlign:"center", color:"var(--dim)", padding:48 }}>
                    {loading ? "Memuatkan data..." : "Tiada rekod dijumpai"}
                  </td></tr>
                )}
                {filtered.map((a, i) => (
                  <tr key={a.id} className="row-hover" style={{ background: i%2 ? "#0f0f2344" : "transparent" }}>
                    <td className="mono" style={{ fontWeight:800, color:"var(--accent)", whiteSpace:"nowrap", fontSize:11 }}>{(a.id||"").slice(-8)}</td>
                    <td className="ellipsis" style={{ maxWidth:130 }}>{a.hospital}</td>
                    <td>{a.department}</td>
                    <td style={{ fontWeight:600 }}>{a.equipmentName}</td>
                    <td className="ellipsis" style={{ maxWidth:160, fontSize:12, color:"var(--muted)" }}>{a.equipmentDescription}</td>
                    <td><span className="tag">{a.assetGroup}</span></td>
                    <td className="mono" style={{ fontWeight:800, color:"var(--yellow)", whiteSpace:"nowrap", fontSize:12 }}>{(a.purchaseCost||0).toLocaleString()}</td>
                    <td><Badge v={a.tncForm} /></td>
                    <td><Badge v={a.kewpa} /></td>
                    <td><Badge v={a.lpo} /></td>
                    <td><Badge v={a.cert} /></td>
                    <td style={{ whiteSpace:"nowrap" }}>
                      <button className="btn" style={{ padding:"5px 9px", background:"#3b82f618", color:"var(--blue)", marginRight:4 }} onClick={() => handleEdit(a)}>{Ic.edit}</button>
                      <button className="btn" style={{ padding:"5px 9px", background:"#ef444418", color:"var(--red)" }} onClick={() => setDelId(a.id)}>{Ic.trash}</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </React.Fragment>
      );

      return (
        <div style={{ padding:"20px 12px" }}>
          {/* Header */}
          <div style={{ maxWidth:1240, margin:"0 auto 18px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              {Ic.fire}
              <div>
                <div style={{ fontSize:20, fontWeight:800, letterSpacing:"-0.5px" }}>
                  <span style={{ color:"var(--accent)" }}>Variation Order</span> — Pendaftaran Aset
                </div>
                <div style={{ fontSize:11, color:"var(--muted)", letterSpacing:2, textTransform:"uppercase", marginTop:2 }}>Asset Registration System</div>
              </div>
            </div>
            <div className="stat" style={{ border:"1px solid #33415522" }}>
              <span style={{ width:8, height:8, borderRadius:"50%", background: mode==="firebase"?"var(--accent)":"var(--green)", boxShadow: mode==="firebase"?"0 0 8px var(--accent)":"0 0 8px var(--green)", display:"inline-block" }} />
              {mode === "firebase" ? "🔥 Firebase Connected" : "💾 Local Mode (Demo)"}
            </div>
          </div>

          {/* Main Card */}
          <div className="glass" style={{ maxWidth:1240, margin:"0 auto", overflow:"hidden", animation:"fadeUp 0.4s ease" }}>
            {view === "list" ? renderList() : renderForm()}
          </div>

          {/* Delete Modal */}
          {delId && (
            <div className="overlay" onClick={() => setDelId(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize:16, marginBottom:8 }}>Padam Aset?</h3>
                <p style={{ color:"var(--muted)", fontSize:13, marginBottom:24, lineHeight:1.6 }}>
                  Padam aset <strong className="mono" style={{ color:"var(--red)" }}>{String(delId).slice(-8)}</strong>?
                  {mode === "firebase" && " Data akan dipadam dari Firebase."}
                </p>
                <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                  <button className="btn btn-ghost" onClick={() => setDelId(null)}>Batal</button>
                  <button className="btn btn-danger" onClick={() => handleDelete(delId)}>Ya, Padam</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && <div className="toast" style={{ background: toast.type==="error" ? "#dc2626" : "#16a34a" }}>{toast.msg}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
